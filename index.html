<!DOCTYPE html>
<!-- Declares this is an HTML5 document — must be first line -->

<html lang="en">
<!-- Root element of the page | lang="en" tells browser/screen readers language is English -->

  <head>
  <!-- Contains metadata — not visible on page, but important for browser & SEO -->

    <meta charset="UTF-8" />
    <!-- Sets character encoding to UTF-8 — supports all languages and special characters -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes page responsive on mobile | width=device-width → matches screen width | initial-scale=1.0 → no zoom on load -->

    <title>Luminary | Photo Gallery</title>
    <!-- Text shown on browser tab and in search engine results -->

  </head>

  <body>
  <!-- Contains everything visible on the page -->

    <div id="root"></div>
    <!-- Empty div where React will inject the entire app | React finds this using document.getElementById('root') -->

    <script type="module" src="/src/index.jsx"></script>
    <!-- Loads the React app entry point | type="module" enables ES module imports (import/export) | src points to main React file -->

  </body>
  <!-- End of visible page content -->

</html>
<!-- End of HTML document -->
